# ============================================================
# UAV_lumberjack
# X500 + 3DOF Arm ROS 2 <-> Gazebo Bridge
# ============================================================


# ============================================================
# J1 Command
# ROS 2 -> Gazebo
# ============================================================

- ros_topic_name: "/lumberjack_arm/j1/cmd_pos"
  gz_topic_name: "/model/x500_lumberjack/joint/j1/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ


# ============================================================
# J2 Command
# ROS 2 -> Gazebo
# ============================================================

- ros_topic_name: "/lumberjack_arm/j2/cmd_pos"
  gz_topic_name: "/model/x500_lumberjack/joint/j2/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ


# ============================================================
# J3 Command
# ROS 2 -> Gazebo
# ============================================================

- ros_topic_name: "/lumberjack_arm/j3/cmd_pos"
  gz_topic_name: "/model/x500_lumberjack/joint/j3/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ


# ============================================================
# Joint State Feedback
# Gazebo -> ROS 2
# ============================================================

- ros_topic_name: "/lumberjack_arm/joint_states"
  gz_topic_name: "/lumberjack_arm/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS