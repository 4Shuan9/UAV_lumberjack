offboard_cutting_demo:
  ros__parameters:
    # ------------------------------------------------------------
    # Scene hint / observation
    # tree_hint is deliberately coarse. Precise branch geometry must
    # come from /perception/branch_model.
    # ------------------------------------------------------------
    tree_hint_x: 4.0
    tree_hint_y: 0.1
    takeoff_height: 3.0
    observe_distance: 1.4
    observe_bearing_offset_deg: 17.0
    # Continuous multi-view scan. Existing OBSERVE fusion is preserved.
    scan_half_angle_deg: 60.0
    scan_angular_speed_deg_s: 4.0
    scan_start_hold_sec: 2.0
    scan_endpoint_hold_sec: 1.5
    scan_return_center: true

    # ------------------------------------------------------------
    # Perception acceptance for TARGET_LOCK
    # ------------------------------------------------------------
    perception_min_points: 60
    perception_max_fit_rms: 0.03
    perception_stable_samples: 5
    perception_center_spread_max: 0.05

    # ------------------------------------------------------------
    # Fixed PREWORK-as-CUT geometry (current demo)
    # chainsaw_body center in PREWORK is about [0.156, 0.03, -0.455]
    # from base_link. The outer cutting side is ~0.036 m farther
    # forward, hence ~0.19 m total forward offset.
    # Legacy offsets retained for compatibility; branch-aligned geometry is used.
    # ------------------------------------------------------------
    cut_z_offset: 0.455
    tool_forward_offset: 0.19
    near_standoff: 0.20
    far_standoff: 0.75
    cut_in_penetration: 0.04
    cut_in_max_distance: 0.30

    # Branch-aligned cross-section cutting.
    # +Y is the middle of one long cutting edge on chainsaw_body.
    cutting_zone_local_y: 0.03625

    # Automatic arm-pose search stays close to the known safe working TCP.
    cut_pose_reference_tcp_x: 0.155885
    cut_pose_reference_tcp_y: 0.030000
    cut_pose_reference_tcp_z: -0.455000
    cut_pose_q2_step_deg: 0.5
    cut_pose_max_tcp_reference_error: 0.10
    cut_pose_max_tcp_z: -0.20

    # ------------------------------------------------------------
    # Motion shaping (world-frame setpoint rate limiting)
    # ------------------------------------------------------------
    takeoff_speed: 0.50
    observe_speed: 0.45
    far_speed: 0.55
    near_speed: 0.18
    cut_in_speed: 0.04
    retreat_speed: 0.12
    return_speed: 0.60
    yaw_rate_deg_s: 35.0

    position_tolerance: 0.08
    # NEAR is only a staging/ready position, so it may use a looser tolerance.
    near_position_tolerance: 0.12
    # CUT_IN is the actual blade insertion and must remain precise.
    cut_in_position_tolerance: 0.02
    retreat_position_tolerance: 0.08
    yaw_tolerance_deg: 5.0

    # ------------------------------------------------------------
    # Cutting safety / timeout
    # ------------------------------------------------------------
    saw_command_rpm: 1000.0
    saw_ready_rpm: 850.0
    saw_ready_hold_sec: 0.40
    cut_timeout_sec: 4.0

    # ------------------------------------------------------------
    # Offboard handshake / task behavior
    # ------------------------------------------------------------
    offboard_prestream_cycles: 20
    auto_land_after_cut: true
    # false: SCAN continues accumulating the current fused model.
    # Set true only when you explicitly want a fresh scan experiment.
    reset_perception_before_scan: false

    # ------------------------------------------------------------
    # Topic names kept as parameters for later replacement/upgrades
    # ------------------------------------------------------------
    gazebo_odom_topic: /model/x500_lumberjack/base_link_odometry

    # PX4 1.16.x compatibility. The node subscribes to all status topics
    # below and automatically uses whichever one is actually publishing.
    # Add/remove names here if a future PX4 message version changes again.
    px4_vehicle_odometry_topic: /fmu/out/vehicle_odometry
    px4_vehicle_status_topics:
      - /fmu/out/vehicle_status_v1
      - /fmu/out/vehicle_status
    px4_offboard_control_mode_topic: /fmu/in/offboard_control_mode
    px4_trajectory_setpoint_topic: /fmu/in/trajectory_setpoint
    px4_vehicle_command_topic: /fmu/in/vehicle_command

    branch_model_topic: /perception/branch_model
    arm_status_topic: /lumberjack_arm/status
    cut_progress_topic: /lumberjack_arm/cut_progress
    cut_success_topic: /lumberjack_arm/cut_success
    target_contact_topic: /lumberjack_arm/target_contact
